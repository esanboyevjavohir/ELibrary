version: '3.8'

services:
  db:
    image: postgres:16
    container_name: elibrary_db
    environment:
      POSTGRES_DB: elibrary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2606
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: elibrary_redis
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: src/ELibrary.API/Dockerfile
    container_name: elibrary_app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Database__ConnectionString=Host=db;Port=5432;Database=elibrary;Username=postgres;Password=2606
      - JwtSettings__SecretKey=595c5584-9729-4dc6-8b4a-a24a7b3fdba0
      - Redis__Configuration=redis:6379
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis

volumes:
  postgres_data: